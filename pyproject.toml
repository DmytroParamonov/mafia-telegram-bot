[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-telegram-bot"
version = "0.2.0"
description = "STALKER-inspired Telegram Mafia game with an automated host, PDA roles, Zone events and solo playtest tools"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "greenlet>=3.1,<4",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.7,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/zone_service.py" = ["F401"]
